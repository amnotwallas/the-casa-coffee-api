[project]
name = "coffee-api"
version = "1.0.0"
description = "API robusta para la mejor cafetería - The Casa Chill & Coffee"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "groq>=0.11.0",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "firebase-admin>=6.5.0",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
